name: XGBoost integration

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xgboost-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: ${{ matrix.runner }} / OCaml 5.3
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15]
    env:
      OMP_NUM_THREADS: "1"
      OMP_THREAD_LIMIT: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.3"
          dune-cache: true

      - name: Install runtime dependencies
        run: opam install ./modelkit.opam ./modelkit-xgboost.opam --deps-only

      - name: Verify production package build
        run: opam exec -- dune build -p modelkit,modelkit-xgboost @install

      - name: Install test and documentation dependencies
        run: opam install ./modelkit.opam ./modelkit-xgboost.opam --deps-only --with-test --with-doc

      - name: Verify native integration and documentation
        run: opam exec -- dune build --only-packages modelkit,modelkit-xgboost @all @runtest @doc @install

      - name: Verify package build
        run: opam exec -- dune build -p modelkit,modelkit-xgboost @install @runtest @doc
