name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    name: ${{ matrix.platform }} / OCaml ${{ matrix.ocaml-compiler }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # The Raven adapters (modelkit-nx, modelkit-talon) build on Linux and
        # macOS only: Nx 1.0.0~alpha3 requires OpenBLAS headers and a C++
        # toolchain that the Windows opam environment does not provide. The
        # portable packages are verified on every platform.
        include:
          - platform: Linux x86-64
            runner: ubuntu-24.04
            ocaml-compiler: "5.2"
            packages: modelkit,modelkit-parallel,modelkit-nx,modelkit-talon
            opam-files: ./modelkit.opam ./modelkit-parallel.opam ./modelkit-nx.opam ./modelkit-talon.opam
          - platform: Linux x86-64
            runner: ubuntu-24.04
            ocaml-compiler: "5.3"
            packages: modelkit,modelkit-parallel,modelkit-nx,modelkit-talon
            opam-files: ./modelkit.opam ./modelkit-parallel.opam ./modelkit-nx.opam ./modelkit-talon.opam
          - platform: Linux x86-64
            runner: ubuntu-24.04
            ocaml-compiler: "5.5"
            packages: modelkit,modelkit-parallel,modelkit-nx,modelkit-talon
            opam-files: ./modelkit.opam ./modelkit-parallel.opam ./modelkit-nx.opam ./modelkit-talon.opam
          - platform: macOS arm64
            runner: macos-15
            ocaml-compiler: "5.2"
            packages: modelkit,modelkit-parallel,modelkit-nx,modelkit-talon
            opam-files: ./modelkit.opam ./modelkit-parallel.opam ./modelkit-nx.opam ./modelkit-talon.opam
          - platform: macOS arm64
            runner: macos-15
            ocaml-compiler: "5.3"
            packages: modelkit,modelkit-parallel,modelkit-nx,modelkit-talon
            opam-files: ./modelkit.opam ./modelkit-parallel.opam ./modelkit-nx.opam ./modelkit-talon.opam
          - platform: macOS arm64
            runner: macos-15
            ocaml-compiler: "5.5"
            packages: modelkit,modelkit-parallel,modelkit-nx,modelkit-talon
            opam-files: ./modelkit.opam ./modelkit-parallel.opam ./modelkit-nx.opam ./modelkit-talon.opam
          - platform: Windows x86-64
            runner: windows-2025
            ocaml-compiler: "5.2"
            packages: modelkit,modelkit-parallel
            opam-files: ./modelkit.opam ./modelkit-parallel.opam
          - platform: Windows x86-64
            runner: windows-2025
            ocaml-compiler: "5.3"
            packages: modelkit,modelkit-parallel
            opam-files: ./modelkit.opam ./modelkit-parallel.opam
          - platform: Windows x86-64
            runner: windows-2025
            ocaml-compiler: "5.5"
            packages: modelkit,modelkit-parallel
            opam-files: ./modelkit.opam ./modelkit-parallel.opam

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}
          dune-cache: true

      - name: Install runtime dependencies
        run: opam install ${{ matrix.opam-files }} --deps-only

      - name: Verify production package build
        run: opam exec -- dune build -p ${{ matrix.packages }} @install

      - name: Install test and documentation dependencies
        run: opam install ${{ matrix.opam-files }} --deps-only --with-test --with-doc

      - name: Build, test, and generate documentation
        run: opam exec -- dune build --only-packages ${{ matrix.packages }} @all @runtest @doc @install

      - name: Verify package build
        run: opam exec -- dune build -p ${{ matrix.packages }} @install @runtest @doc

  workspace-locks:
    name: macOS arm64 / complete workspace locks
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Read the locked compiler
        id: lock
        run: |
          compiler=$(sed -nE 's/^[[:space:]]*"ocaml" \{= "([^"]+)"\}$/\1/p' modelkit.opam.locked.macos-arm64)
          test -n "$compiler"
          echo "compiler=$compiler" >> "$GITHUB_OUTPUT"

      - name: Set up the locked compiler
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ steps.lock.outputs.compiler }}
          dune-cache: true

      - name: Install the development formatter
        run: opam install ocamlformat.0.29.0

      - name: Install all five packages' locked dependencies
        run: opam install . --deps-only --with-test --with-doc --locked --lock-suffix=locked.macos-arm64

      - name: Verify the complete locked workspace
        run: opam exec -- dune build @all @runtest @doc @fmt @opam @install

      - name: Verify the package build
        run: opam exec -- dune build -p modelkit,modelkit-parallel,modelkit-nx,modelkit-talon,modelkit-xgboost @install @runtest @doc
